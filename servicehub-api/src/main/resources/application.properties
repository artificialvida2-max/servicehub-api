# ===== ServiceHub API - Configurações =====

# Porta do servidor (padrão é 8080)
server.port=8080

# Nome da aplicação
spring.application.name=servicehub-api

# Prefixo global para todas as rotas
server.servlet.context-path=/

# Nível de log (DEBUG para desenvolvimento)
logging.level.com.servicehub=DEBUG

# Exibir queries SQL (útil para a próxima aula)
spring.jpa.show-sql=true

# Formato de data/hora na API
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# =============================================
# Configuração do DataSource (PostgreSQL)
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicehub}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# Configuração do JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# Configuração do Flyway
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET:chaveDeTesteMuitoLongaParaAlgoritmoHS256PrecisaTerNoMinimo256Bits}
jwt.expiration=${JWT_EXPIRATION:86400000}
spring.graphql.graphiql.enabled=true
spring.graphql.schema.locations=classpath:graphql/
