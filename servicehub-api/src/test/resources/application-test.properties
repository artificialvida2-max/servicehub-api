# Desabilitar ddl-auto — Flyway gerencia o schema
spring.jpa.hibernate.ddl-auto=none

# Habilitar Flyway para aplicar migrations nos testes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT para testes
jwt.secret=chaveTesteMuitoLongaParaAlgoritmoHS256PrecisaTerNoMinimo256BitsAqui123456
jwt.expiration=3600000

# Logs
logging.level.org.testcontainers=INFO
logging.level.com.servicehub=DEBUG
